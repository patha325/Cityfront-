name: Godot checks

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Parse project and scripts
        run: godot --headless --path . --editor --quit

      - name: Launch game headlessly
        run: godot --headless --path . --quit-after 3
